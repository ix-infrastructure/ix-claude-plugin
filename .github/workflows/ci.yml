name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every source file must carry the copyright line. In this job rather than
      # a workflow of its own: the ruleset requires exactly one status check,
      # `CI Passed`, and `validate` is in its `needs` — a check in any other
      # workflow reports on the PR and gates nothing. Toolchain-free (stdlib
      # python3 is preinstalled; the script shells out only to git).
      - name: Copyright headers on every source file
        run: python3 .github/scripts/copyright-headers.py

      - name: Validate JSON files
        run: |
          echo "── JSON validation ──"
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            if jq -e . "$f" >/dev/null 2>&1; then
              echo "  [ok] $f"
            else
              echo "  [FAIL] $f is invalid JSON"
              exit 1
            fi
          done

      # Belt-and-suspenders: parse every committed JSON file (manifests +
      # fixtures), not just the three core manifests above. node is preinstalled
      # on ubuntu-latest; node_modules/.git are excluded.
      - name: Validate all JSON parses
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then
              echo "  [ok] $f"
            else
              echo "  [FAIL] invalid JSON: $f"
              fail=1
            fi
          done < <(find . -name '*.json' \
            -not -path './.git/*' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0)
          exit $fail

      - name: Validate plugin version consistency
        run: |
          echo "── Version consistency ──"
          PLUGIN_VER=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKETPLACE_VER=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          echo "  plugin.json:      $PLUGIN_VER"
          echo "  marketplace.json: $MARKETPLACE_VER"
          if [ "$PLUGIN_VER" != "$MARKETPLACE_VER" ]; then
            echo "  [FAIL] version mismatch"
            exit 1
          fi
          echo "  [ok] versions match"

      - name: Validate expected skills
        run: |
          echo "── Skills ──"
          FAIL=0
          for skill in ix-understand ix-investigate ix-impact ix-plan ix-debug ix-architecture ix-docs; do
            if [ -f "skills/$skill/SKILL.md" ]; then
              echo "  [ok] $skill"
            else
              echo "  [FAIL] missing: skills/$skill/SKILL.md"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate expected agents
        run: |
          echo "── Agents ──"
          FAIL=0
          for agent in ix-explorer ix-system-explorer ix-bug-investigator ix-safe-refactor-planner ix-architecture-auditor; do
            if [ -f "agents/$agent.md" ]; then
              echo "  [ok] $agent"
            else
              echo "  [FAIL] missing: agents/$agent.md"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate hooks
        run: |
          echo "── Hooks ──"
          FAIL=0
          for hook in ix-briefing.sh ix-intercept.sh ix-read.sh ix-bash.sh ix-pre-edit.sh ix-ingest.sh ix-map.sh; do
            if [ -f "hooks/$hook" ] && [ -x "hooks/$hook" ]; then
              echo "  [ok] $hook"
            elif [ -f "hooks/$hook" ]; then
              echo "  [FAIL] $hook exists but is not executable"
              FAIL=1
            else
              echo "  [FAIL] missing: hooks/$hook"
              FAIL=1
            fi
          done
          exit $FAIL

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest. Scope to error severity so
      # the gate catches real bugs without failing on stylistic notes. Covers
      # every committed *.sh (hooks, libs, installers, tests), not just hooks/.
      - name: Run shellcheck on all shell scripts
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -d '' files < <(find . -name '*.sh' \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"; exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

  # ── Aggregate gate ───────────────────────────────────────────────────────
  # One stable required-status-check context. Fails if any upstream job failed
  # OR was skipped/cancelled, so the job graph can be reshaped without orphaning
  # the required check.
  hooks-tests:
    name: Hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `jq` and `bash` are preinstalled on ubuntu-latest, which is everything
      # tests/test_hooks.sh declares it needs. No `ix` is installed on purpose:
      # the suite fakes the binary where it needs one, and the "ix unavailable"
      # cases strip whatever `ix` is on PATH, so a runner without one exercises
      # the same paths a developer's machine does.
      - name: Run hook tests
        run: bash tests/test_hooks.sh

  # The hooks against a released ix CLI instead of tests/mock-ix.sh, with no
  # backend (IX_ENDPOINT is a closed port). Fails when a hook passes a flag the
  # pinned CLI does not have, or mishandles what the real CLI prints. Not in
  # `ci-success` yet: it reports on the PR without gating merges.
  real-ix:
    name: Hooks against real ix
    runs-on: ubuntu-latest
    env:
      IX_VERSION: "0.12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # `ix text` shells out to ripgrep.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install ix ${{ env.IX_VERSION }}
        run: |
          set -euo pipefail
          tarball="ix-${IX_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/ix-infrastructure/Ix/releases/download/v${IX_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/${tarball}.sha256"
          sha256sum -c "${tarball}.sha256"
          mkdir -p ix
          tar -xzf "$tarball" -C ix --strip-components=1
          echo "$RUNNER_TEMP/ix" >> "$GITHUB_PATH"

      - name: Run hooks against real ix
        env:
          IX_EXPECT_VERSION: ${{ env.IX_VERSION }}
        run: |
          ix --version
          bash tests/test_real_ix.sh

  ci-success:
    name: CI Passed
    if: always()
    needs: [validate, shellcheck, hooks-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "shellcheck=${{ needs.shellcheck.result }}"
          [ "${{ needs.validate.result }}" = "success" ] \
            && [ "${{ needs.shellcheck.result }}" = "success" ]
